<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#C6FF34" />
  <meta name="description" content="Chat. – Messagerie instantanée chiffrée et rapide" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chat." />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Open Graph -->
  <meta property="og:title" content="Chat. – Messagerie instantanée" />
  <meta property="og:description" content="Discutez en temps réel avec vos contacts" />
  <meta property="og:type" content="website" />

  <title>Chat.</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%;
      background: #171717;
      overflow: hidden;
    }
    #splash {
      position: fixed; inset: 0;
      background: #171717;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash .logo {
      font-family: 'Inter', sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -2px;
    }
    #splash .logo span { color: #C6FF34; }
    #splash .loader {
      width: 40px; height: 4px;
      background: #2A2A2A;
      border-radius: 2px;
      overflow: hidden;
    }
    #splash .loader::after {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      background: #C6FF34;
      border-radius: 2px;
      animation: load 1s ease infinite;
    }
    @keyframes load {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="splash">
    <div class="logo">21<span>Chat.</span></div>
    <div class="loader"></div>
  </div>

  <div id="root"></div>

  <!-- React + Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Main App (copy chat-app.jsx content here, or use a bundler) -->
  <!--
    To use with a bundler (Vite/CRA):
    1. npm install react react-dom @supabase/supabase-js
    2. Replace SUPABASE_URL and SUPABASE_ANON_KEY in chat-app.jsx
    3. Run: npm run dev
  -->

  <script>
    // ── Register Service Worker ────────────────────────────────────────────
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("service-worker.js")
          .then((reg) => console.log("SW registered:", reg.scope))
          .catch((err) => console.warn("SW registration failed:", err));
      });
    }

    // ── Hide splash ────────────────────────────────────────────────────────
    window.addEventListener("load", () => {
      setTimeout(() => {
        const splash = document.getElementById("splash");
        if (splash) splash.classList.add("hidden");
      }, 800);
    });
  </script>
</body>
</html>
